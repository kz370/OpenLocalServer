[package]
name = "openlocalserver"
version.workspace = true
description = "OpenLocalServer: a free, open-source, cross-platform local development environment manager"
authors = ["OpenLocalServer contributors"]
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.6", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tracing = "0.1"
ols-core = { path = "../crates/ols-core" }

[target.'cfg(windows)'.dependencies]
# Only for the Windows notification identity (AppUserModelID + its HKCU entries), the
# toast itself, and the taskbar/Alt+Tab icon slot (WM_SETICON/ICON_BIG), which Tauri has
# no call for.
windows = { version = "0.61", features = [
  "Data_Xml_Dom",
  "Foundation",
  "UI_Notifications",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Registry",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }
