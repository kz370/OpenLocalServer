<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OLS — Open Local Server</title>
    <!--
      The site is served from the repository root (index.html), because that is what
      GitHub Pages publishes. This file only exists so the old website/ URL keeps
      working; it redirects and offers a link if the redirect is blocked.
    -->
    <meta http-equiv="refresh" content="0; url=../index.html" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/css/site.css" />
    <style>
      body {
        display: grid;
        place-items: center;
        min-height: 100svh;
        padding: 24px;
      }
      .redirect {
        max-width: 42ch;
        text-align: center;
      }
      .redirect img {
        width: 60px;
        height: 60px;
        margin: 0 auto 20px;
        border-radius: 14px;
      }
      .redirect p {
        color: var(--fg-muted);
      }
      .redirect .btn {
        margin-top: 24px;
      }
    </style>
  </head>
  <body>
    <main class="redirect">
      <img src="assets/img/logo.svg" alt="OLS" width="60" height="60" />
      <h1>OLS — Open Local Server</h1>
      <p>The site has moved to the repository root.</p>
      <p><a class="btn btn--primary" href="../index.html">Open the site</a></p>
    </main>
    <script>
      location.replace("../index.html");
    </script>
  </body>
</html>
