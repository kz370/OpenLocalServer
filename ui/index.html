<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenLocalServer</title>
    <script>
      // Apply the stored theme before the first paint. The React ThemeProvider does
      // the same thing in an effect, which runs after the first frame — without this
      // a dark-theme start flashes a white window on the way to dark.
      ;(function () {
        try {
          var stored = localStorage.getItem('ols-theme') || 'system'
          var dark =
            stored === 'dark' ||
            (stored === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {
          /* private mode: fall back to the light theme */
        }
        // The app window is transparent and is created hidden, then revealed once the
        // UI reports it has painted. Until React mounts there is nothing painted, so
        // `booting` keeps the page on the app's own background: an early reveal (the
        // Rust fallback timer) then shows a solid window instead of a see-through one.
        // `main.tsx` drops the class on the first painted frame.
        document.documentElement.classList.add('booting')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
