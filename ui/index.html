<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>OpenLocalServer</title>
    <script>
      // Apply the stored theme before the first paint to prevent theme and background flashes.
      ;(function () {
        try {
          var mode = 'system'
          var parsed = null
          var raw = localStorage.getItem('ols-appearance')
          if (raw) {
            try {
              parsed = JSON.parse(raw)
              if (parsed && parsed.mode) mode = parsed.mode
            } catch (err) {}
          } else {
            mode = localStorage.getItem('ols-theme') || 'system'
          }
          var dark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (parsed && parsed.overrides) {
            if (parsed.overrides.accent) {
              document.documentElement.style.setProperty('--primary', parsed.overrides.accent)
              document.documentElement.style.setProperty('--ring', parsed.overrides.accent)
            }
            // Background is stored per mode ({ light, dark }). Only the active mode's own
            // gradient is pre-painted; an inherited (adapted) one is computed by the app.
            var bgs = parsed.overrides.background
            var bg = bgs && !bgs.type ? bgs[dark ? 'dark' : 'light'] : null
            if (bg && bg.type === 'gradient') {
              document.documentElement.style.setProperty(
                '--app-background',
                'linear-gradient(' + (bg.angle || 135) + 'deg, ' + bg.from + ', ' + bg.to + ')'
              )
            }
          }
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {
          /* private mode: fall back to default */
        }
        // The app window is transparent and is created hidden, then revealed once the
        // UI reports it has painted. Until React mounts there is nothing painted, so
        // `booting` keeps the page on the app's own background: an early reveal (the
        // Rust fallback timer) then shows a solid window instead of a see-through one.
        // `main.tsx` drops the class on the first painted frame.
        document.documentElement.classList.add('booting')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
