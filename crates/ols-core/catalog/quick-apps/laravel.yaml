id: laravel
name: Laravel
description: A new Laravel application with a database, Mailpit and a trusted HTTPS domain.
category: php

requirements:
  php: "8.4"
  composer: true
  node: "24"
  mariadb: true
  mailpit: true
  redis: true

variables:
  - name: project_name
    label: Project name
    type: text
    required: true
    validation: "[A-Za-z][A-Za-z0-9_-]*"
  - name: parent_dir
    label: Create in
    type: directory
    default: "{{ default_projects_dir }}"
  - name: php_version
    label: PHP
    type: runtime-version
    runtime: php
    default: "8.4"
  - name: node
    label: Install frontend dependencies (Node)
    type: boolean
    default: true
  - name: database
    label: Database
    type: select
    options: [mariadb, none]
    default: mariadb
  - name: db_name
    label: Database name
    type: text
    default: "{{ project_name | slug | replace('-', '_') }}"
    validation: "[A-Za-z0-9_]+"
    show_if: "database != none"
  - name: redis
    label: Redis (start it from Services)
    type: boolean
    default: false
  - name: mailpit
    label: Capture mail with Mailpit
    type: boolean
    default: true
  - name: domain
    label: Domain
    type: domain
    default: "{{ project_name | slug }}.test"
  - name: https
    label: HTTPS
    type: boolean
    default: true
  - name: wildcard
    label: Wildcard subdomains (*.domain)
    type: boolean
    default: false

commands:
  - name: Create the Laravel project
    run: composer create-project laravel/laravel "{{ project_path }}" --no-interaction --prefer-dist
    cwd: "{{ parent_dir }}"

env_vars:
  - { key: APP_NAME, value: "{{ project_name }}" }
  - { key: APP_URL, value: "{{ 'https' if https else 'http' }}://{{ domain }}" }
  - { key: DB_CONNECTION, value: "{{ database }}", if: "database != none" }
  - { key: DB_HOST, value: "127.0.0.1", if: "database != none" }
  - { key: DB_PORT, value: "3306", if: "database != none" }
  - { key: DB_DATABASE, value: "{{ db_name }}", if: "database != none" }
  - { key: DB_USERNAME, value: "root", if: "database != none" }
  - { key: DB_PASSWORD, value: "", if: "database != none" }
  - { key: REDIS_HOST, value: "127.0.0.1", if: redis }
  - { key: REDIS_PORT, value: "6379", if: redis }
  - { key: MAIL_MAILER, value: "smtp", if: mailpit }
  - { key: MAIL_HOST, value: "127.0.0.1", if: mailpit }
  - { key: MAIL_PORT, value: "1025", if: mailpit }

post_create:
  - name: Create the database
    action: create_database
    with: { engine: "{{ database }}", name: "{{ db_name }}" }
    if: "database != none"
  - name: Run migrations
    run: php artisan migrate --force
    cwd: "{{ project_path }}"
    if: "database != none"

install:
  - name: Install frontend dependencies
    run: npm install
    cwd: "{{ project_path }}"
    if: node
  - name: Build frontend assets
    run: npm run build
    cwd: "{{ project_path }}"
    if: node
    allow_failure: true

domain:
  hostname: "{{ domain }}"
  kind: php
  root: "{{ project_path }}/public"

environment:
  https: true
  mailpit: true
