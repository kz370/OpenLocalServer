id: vue-vite
name: Vue + Vite
description: A Vue 3 app on the Vite dev server, proxied behind a trusted HTTPS domain with hot reload.
category: node

requirements:
  node: "24"

variables:
  - name: project_name
    label: Project name
    type: text
    required: true
    validation: "[A-Za-z][A-Za-z0-9_-]*"
  - name: parent_dir
    label: Create in
    type: directory
    default: "{{ default_projects_dir }}"
  - name: node_version
    label: Node
    type: runtime-version
    runtime: node
    default: "24"
  - name: port
    label: Dev server port
    type: port
    default: 5174
  - name: domain
    label: Domain
    type: domain
    default: "{{ project_name | slug }}.test"
  - name: https
    label: HTTPS
    type: boolean
    default: true
  - name: wildcard
    label: Wildcard subdomains (*.domain)
    type: boolean
    default: false

files:
  - path: package.json
    content: |
      {
        "name": "{{ project_slug }}",
        "private": true,
        "version": "0.0.0",
        "type": "module",
        "scripts": {
          "dev": "vite",
          "build": "vite build",
          "preview": "vite preview"
        },
        "dependencies": {
          "vue": "^3.5.0"
        },
        "devDependencies": {
          "@vitejs/plugin-vue": "^6.0.0",
          "vite": "^8.3.0"
        }
      }
  - path: vite.config.js
    content: |
      import { defineConfig } from 'vite'
      import vue from '@vitejs/plugin-vue'

      // Served through OpenLocalServer at {{ domain }}: Vite must accept that Host header,
      // and the hot-reload socket must connect back through the proxy, not to the dev port.
      export default defineConfig({
        plugins: [vue()],
        server: {
          host: '127.0.0.1',
          port: {{ port }},
          strictPort: true,
          allowedHosts: ['{{ domain }}', '.{{ domain }}'],
          hmr: { protocol: '{{ 'wss' if https else 'ws' }}', host: '{{ domain }}', clientPort: {{ site_port }} },
        },
      })
  - path: index.html
    content: |
      <!doctype html>
      <html lang="en">
        <head>
          <meta charset="UTF-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1.0" />
          <title>{{ project_name }}</title>
        </head>
        <body>
          <div id="app"></div>
          <script type="module" src="/src/main.js"></script>
        </body>
      </html>
  - path: src/main.js
    content: |
      import { createApp } from 'vue'
      import App from './App.vue'

      createApp(App).mount('#app')
  - path: src/App.vue
    content: |
      <script setup>
      import { ref } from 'vue'
      const count = ref(0)
      </script>

      <template>
        <main class="page">
          <h1>{{ project_name }}</h1>
          <p>Running at {{ domain }} through OpenLocalServer.</p>
          <button @click="count++">count is {{ '{{' }} count {{ '}}' }}</button>
        </main>
      </template>

      <style>
      .page { font-family: system-ui; padding: 2rem; }
      </style>

install:
  - name: Install dependencies
    run: npm install
    cwd: "{{ project_path }}"

domain:
  hostname: "{{ domain }}"
  kind: proxy
  port: "{{ port }}"
  root: "{{ project_path }}"
  app:
    run: npm run dev
    runtime: node
    cwd: "{{ project_path }}"

environment:
  https: true
