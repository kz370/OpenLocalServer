id: wordpress
name: WordPress
description: The latest WordPress, checksum-verified, with its database and wp-config.php already set up.
category: php

requirements:
  php: "8.4"
  mysql: true
  mariadb: true
  mailpit: true

variables:
  - name: project_name
    label: Project name
    type: text
    required: true
    validation: "[A-Za-z][A-Za-z0-9_-]*"
  - name: parent_dir
    label: Create in
    type: directory
    default: "{{ default_projects_dir }}"
  - name: php_version
    label: PHP
    type: runtime-version
    runtime: php
    default: "8.4"
  - name: database
    label: Database
    type: select
    options: [mysql, mariadb]
    default: mysql
  - name: db_name
    label: Database name
    type: text
    default: "{{ project_name | slug | replace('-', '_') }}"
    validation: "[A-Za-z0-9_]+"
  - name: mailpit
    label: Capture mail with Mailpit
    type: boolean
    default: true
  - name: domain
    label: Domain
    type: domain
    default: "{{ project_name | slug }}.test"
  - name: https
    label: HTTPS
    type: boolean
    default: true
  - name: wildcard
    label: Wildcard subdomains (*.domain)
    type: boolean
    default: false

commands:
  - name: Download WordPress
    action: download_extract
    with:
      url: "https://wordpress.org/latest.zip"
      sha1_url: "https://wordpress.org/latest.zip.sha1"
      dest: "{{ project_path }}"
      strip: "wordpress"

files:
  - path: wp-config.php
    content: |
      <?php
      // Generated by OpenLocalServer.
      define( 'DB_NAME', '{{ db_name }}' );
      define( 'DB_USER', 'root' );
      define( 'DB_PASSWORD', '' );
      define( 'DB_HOST', '127.0.0.1:{{ 3306 if database == 'mysql' else 3307 }}' );
      define( 'DB_CHARSET', 'utf8mb4' );
      define( 'DB_COLLATE', '' );

      define( 'AUTH_KEY',         '{{ random_string(64) }}' );
      define( 'SECURE_AUTH_KEY',  '{{ random_string(64) }}' );
      define( 'LOGGED_IN_KEY',    '{{ random_string(64) }}' );
      define( 'NONCE_KEY',        '{{ random_string(64) }}' );
      define( 'AUTH_SALT',        '{{ random_string(64) }}' );
      define( 'SECURE_AUTH_SALT', '{{ random_string(64) }}' );
      define( 'LOGGED_IN_SALT',   '{{ random_string(64) }}' );
      define( 'NONCE_SALT',       '{{ random_string(64) }}' );

      $table_prefix = 'wp_';
      define( 'WP_DEBUG', true );
      define( 'WP_HOME',    '{{ 'https' if https else 'http' }}://{{ domain }}' );
      define( 'WP_SITEURL', '{{ 'https' if https else 'http' }}://{{ domain }}' );
      {% if https %}$_SERVER['HTTPS'] = 'on';
      {% endif %}
      if ( ! defined( 'ABSPATH' ) ) {
          define( 'ABSPATH', __DIR__ . '/' );
      }
      require_once ABSPATH . 'wp-settings.php';

post_create:
  - name: Create the database
    action: create_database
    with: { engine: "{{ database }}", name: "{{ db_name }}" }

domain:
  hostname: "{{ domain }}"
  kind: php
  root: "{{ project_path }}"

environment:
  https: true
  mailpit: true
