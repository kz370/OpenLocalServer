    <rect x="260" y="276" width="504" height="120" rx="26" fill="#FFFFFF"/>
    <circle cx="322" cy="336" r="22" fill="#4ADE80"/>

    <rect x="260" y="452" width="504" height="120" rx="26" fill="#FFFFFF"/>
    <circle cx="322" cy="512" r="22" fill="#4ADE80"/>

    <rect x="260" y="628" width="504" height="120" rx="26" fill="#FFFFFF"/>
    <circle cx="322" cy="688" r="22" fill="#4ADE80"/>
